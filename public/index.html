<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3 File Manager</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }
        .upload-container {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin: 30px 0;
            transition: all 0.3s;
            background-color: #f9f9f9;
        }
        .upload-container:hover, .upload-container.dragover {
            border-color: #007bff;
            background-color: #f0f7ff;
        }
        .file-input {
            display: none;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .file-list {
            margin-top: 20px;
            text-align: left;
        }
        .file-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status {
            font-size: 14px;
            padding: 3px 8px;
            border-radius: 3px;
        }
        .status.pending {
            background-color: #ffeeba;
            color: #856404;
        }
        .status.uploading {
            background-color: #b8daff;
            color: #004085;
        }
        .status.success {
            background-color: #c3e6cb;
            color: #155724;
        }
        .status.failed {
            background-color: #f5c6cb;
            color: #721c24;
        }
        .progress-bar {
            height: 5px;
            background-color: #e9ecef;
            border-radius: 3px;
            margin-top: 5px;
            position: relative;
        }
        .progress {
            height: 100%;
            background-color: #007bff;
            border-radius: 3px;
            width: 0%;
            transition: width 0.2s;
        }
        .hidden {
            display: none;
        }
        .nav {
            display: flex;
            background-color: #f8f9fa;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }
        .nav-tab:hover {
            background-color: #e9ecef;
        }
        .nav-tab.active {
            background-color: #e9ecef;
            border-bottom: 3px solid #007bff;
            font-weight: bold;
        }
        .file-browser {
            margin-top: 20px;
        }
        .file-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .file-table th, .file-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .file-table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        .file-table tr:hover {
            background-color: #f8f9fa;
        }
        .file-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .download-btn {
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .download-btn:hover {
            background-color: #218838;
        }
        .region-select {
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ced4da;
            font-size: 14px;
        }
        .refresh-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #6c757d;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
        }

        /* Toggle Switch Styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #007bff;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }
    </style>
</head>
<body>
    <h1>S3 File Manager</h1>

    <div style="margin-bottom: 20px; padding: 15px; background-color: #f8f9fa; border-radius: 5px;">
        <h3>Bucket Object Lock</h3>
        <label for="bucketObjectLockToggle" style="margin-right: 10px;">
            Do you want to make sure files don't get modified?
        </label>
        <label class="switch">
            <input type="checkbox" id="bucketObjectLockToggle">
            <span class="slider round"></span>
        </label>
        <span id="bucketObjectLockStatus" style="margin-left: 10px;">Object Lock: Disabled</span>
        <p id="objectLockMessage" style="font-size: 14px; color: #6c757d; margin-top: 5px;"></p>
    </div>
    
    <div class="nav">
        <div class="nav-tab active" data-tab="upload">Upload Files</div>
        <div class="nav-tab" data-tab="browse">Browse Files</div>
    </div>
    
    <div class="tab-content" id="upload-tab">
        <p>Upload your files directly to Amazon S3 bucket.</p>
        
        <div class="upload-container" id="dropZone">
            <h2>Drag & Drop Files Here</h2>
            <p>or</p>
            <input type="file" id="fileInput" class="file-input" multiple>
            <button class="btn" id="browseBtn">Browse Files</button>
        </div>
        
        <div class="file-list hidden" id="fileList">
            <h3>Files to Upload</h3>
            <div id="files"></div>
            <button class="btn" id="uploadBtn">Upload All Files</button>
        </div>
    </div>
    
    <div class="tab-content hidden" id="browse-tab">
        <p>Browse and download your files from Amazon S3 bucket.</p>
        
        <div class="refresh-container">
            <h3>Your Files</h3>
            <button class="btn btn-secondary" id="refreshFiles">
                <span>Refresh List</span>
            </button>
        </div>
        
        <div class="file-browser" id="fileBrowser">
            <div class="loader-text" id="fileLoading">
                <span class="loading-spinner"></span> Loading files...
            </div>
            <div id="fileTableContainer"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Tab Navigation
            const tabs = document.querySelectorAll('.nav-tab');
            const tabContents = document.querySelectorAll('.tab-content');

            // Object Lock Toggle functionality
            const bucketObjectLockToggle = document.getElementById('bucketObjectLockToggle');
            const bucketObjectLockStatus = document.getElementById('bucketObjectLockStatus');
            const objectLockMessage = document.getElementById('objectLockMessage');

            // Load initial Object Lock status
            loadObjectLockStatus();

            // Toggle switch event listener
            bucketObjectLockToggle.addEventListener('change', function() {
                const enable = this.checked;
                toggleObjectLock(enable);
            });

            // Function to load current Object Lock status
            async function loadObjectLockStatus() {
                try {
                    const response = await fetch('/toggle-object-lock');
                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to fetch Object Lock status');
                    }

                    bucketObjectLockToggle.checked = data.enabled;
                    bucketObjectLockStatus.textContent = data.enabled ? 'Object Lock: Enabled' : 'Object Lock: Disabled';
                    objectLockMessage.textContent = data.enabled 
                        ? `Default retention: ${data.mode} mode until ${new Date(data.retainUntil).toLocaleString()}`
                        : 'Files can be modified or deleted.';
                } catch (error) {
                    console.error('Error loading Object Lock status:', error);
                    objectLockMessage.textContent = `Error: ${error.message}`;
                    objectLockMessage.style.color = '#721c24';
                }
            }

            // Function to toggle Object Lock
            async function toggleObjectLock(enable) {
                try {
                    objectLockMessage.textContent = 'Updating Object Lock status...';
                    objectLockMessage.style.color = '#004085';

                    const response = await fetch('/toggle-object-lock', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ enable })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to toggle Object Lock');
                    }

                    bucketObjectLockStatus.textContent = enable ? 'Object Lock: Enabled' : 'Object Lock: Disabled';
                    objectLockMessage.textContent = enable 
                        ? `Default retention: ${data.mode} mode until ${new Date(data.retainUntil).toLocaleString()}`
                        : 'Files can be modified or deleted.';
                    objectLockMessage.style.color = '#155724';
                } catch (error) {
                    console.error('Error toggling Object Lock:', error);
                    bucketObjectLockToggle.checked = !enable; // Revert toggle on error
                    objectLockMessage.textContent = `Error: ${error.message}`;
                    objectLockMessage.style.color = '#721c24';
                }
            }
            
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    tabContents.forEach(content => content.classList.add('hidden'));
                    const tabId = this.getAttribute('data-tab');
                    document.getElementById(`${tabId}-tab`).classList.remove('hidden');
                    if (tabId === 'browse') loadFiles();
                });
            });
            
            // Upload functionality
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
            const browseBtn = document.getElementById('browseBtn');
            const fileList = document.getElementById('fileList');
            const filesContainer = document.getElementById('files');
            const uploadBtn = document.getElementById('uploadBtn');
            
            let filesToUpload = [];
            
            browseBtn.addEventListener('click', function() {
                fileInput.click();
            });
            
            fileInput.addEventListener('change', function() {
                handleFiles(this.files);
            });
            
            dropZone.addEventListener('dragover', function(e) {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
            
            dropZone.addEventListener('dragleave', function() {
                dropZone.classList.remove('dragover');
            });
            
            dropZone.addEventListener('drop', function(e) {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });
            
            uploadBtn.addEventListener('click', function() {
                uploadFiles();
            });
            
            function handleFiles(files) {
                if (files.length === 0) return;
                for (const file of files) {
                    const fileExists = filesToUpload.some(f => f.name === file.name && f.size === file.size);
                    if (!fileExists) filesToUpload.push(file);
                }
                fileList.classList.remove('hidden');
                renderFileList();
            }
            
            function renderFileList() {
                filesContainer.innerHTML = '';
                filesToUpload.forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    fileItem.id = `file-${index}`;
                    
                    const fileInfo = document.createElement('div');
                    fileInfo.innerHTML = `
                        <strong>${file.name}</strong> (${formatFileSize(file.size)})
                        <div class="progress-bar">
                            <div class="progress" id="progress-${index}"></div>
                        </div>
                    `;
                    
                    const fileStatus = document.createElement('span');
                    fileStatus.className = 'status pending';
                    fileStatus.id = `status-${index}`;
                    fileStatus.textContent = 'Pending';
                    
                    fileItem.appendChild(fileInfo);
                    fileItem.appendChild(fileStatus);
                    filesContainer.appendChild(fileItem);
                });
            }
            
            function uploadFiles() {
                if (filesToUpload.length === 0) return;
                filesToUpload.forEach((file, index) => uploadFile(file, index));
            }
            
            function uploadFile(file, index) {
                const statusElement = document.getElementById(`status-${index}`);
                const progressElement = document.getElementById(`progress-${index}`);
                
                statusElement.className = 'status uploading';
                statusElement.textContent = 'Uploading...';
                
                const formData = new FormData();
                formData.append('file', file);
                
                const xhr = new XMLHttpRequest();
                
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percentComplete = Math.round((e.loaded / e.total) * 100);
                        progressElement.style.width = percentComplete + '%';
                    }
                });
                
                xhr.addEventListener('load', () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const response = JSON.parse(xhr.responseText);
                        statusElement.className = 'status success';
                        statusElement.textContent = `Uploaded to ${response.regionName}`;
                        filesToUpload = filesToUpload.filter(f => f !== file);
                        if (filesToUpload.length === 0) {
                            setTimeout(() => {
                                fileList.classList.add('hidden');
                                filesContainer.innerHTML = '';
                            }, 3000);
                        }
                    } else {
                        statusElement.className = 'status failed';
                        statusElement.textContent = 'Failed';
                    }
                });
                
                xhr.addEventListener('error', () => {
                    statusElement.className = 'status failed';
                    statusElement.textContent = 'Failed';
                });
                
                xhr.open('POST', '/upload', true);
                xhr.send(formData);
            }
            
            // File browsing functionality
            const fileBrowser = document.getElementById('fileBrowser');
            const fileLoading = document.getElementById('fileLoading');
            const fileTableContainer = document.getElementById('fileTableContainer');
            const refreshFilesBtn = document.getElementById('refreshFiles');
            
            refreshFilesBtn.addEventListener('click', loadFiles);
            
            async function loadFiles() {
                fileLoading.style.display = 'flex';
                fileTableContainer.innerHTML = '';
                
                try {
                    const response = await fetch('/files');
                    const data = await response.json();
                    
                    fileLoading.style.display = 'none';
                    
                    if (!response.ok) throw new Error(data.error || 'Failed to load files');
                    
                    if (!data.files || data.files.length === 0) {
                        fileTableContainer.innerHTML = `
                            <div class="empty-state">
                                <i>📁</i>
                                <h3>No files found</h3>
                                <p>Upload some files to see them here.</p>
                            </div>
                        `;
                        return;
                    }
                    
                    let tableHTML = `
                        <table class="file-table">
                            <thead>
                                <tr>
                                    <th>File Name</th>
                                    <th>Size</th>
                                    <th>Uploaded On</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    const regionOptions = Object.entries(data.availableRegions)
                        .map(([code, name]) => `<option value="${code}">${name}</option>`)
                        .join('');
                    
                    data.files.forEach(file => {
                        const size = formatFileSize(file.size);
                        const date = new Date(file.lastModified).toLocaleString();
                        const fileName = file.fileName || file.key.split('/').pop();
                        
                        tableHTML += `
                            <tr data-key="${file.key}">
                                <td>${fileName}</td>
                                <td>${size}</td>
                                <td>${date}</td>
                                <td>
                                    <div class="file-actions">
                                        <select class="region-select">
                                            ${regionOptions}
                                        </select>
                                        <button class="download-btn">Download</button>
                                    </div>
                                    <div class="download-status"></div>
                                </td>
                            </tr>
                        `;
                    });
                    
                    tableHTML += `
                            </tbody>
                        </table>
                    `;
                    
                    fileTableContainer.innerHTML = tableHTML;
                    
                    document.querySelectorAll('.download-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const row = this.closest('tr');
                            const key = row.getAttribute('data-key');
                            const regionSelect = row.querySelector('.region-select');
                            const region = regionSelect.value;
                            const statusElement = row.querySelector('.download-status');
                            downloadFile(key, region, statusElement);
                        });
                    });
                    
                } catch (error) {
                    console.error('Failed to load files:', error);
                    fileLoading.style.display = 'none';
                    fileTableContainer.innerHTML = `
                        <div class="empty-state">
                            <p class="status failed">Error loading files: ${error.message}</p>
                            <button class="btn btn-secondary" onclick="loadFiles()">Try Again</button>
                        </div>
                    `;
                }
            }
            
            async function downloadFile(key, region, statusElement) {
                try {
                    statusElement.innerHTML = '<span class="status uploading">Generating link...</span>';
                    
                    const response = await fetch('/download', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ key, region })
                    });
                    
                    const result = await response.json();
                    
                    if (!response.ok) throw new Error(result.error || 'Failed to generate download link');
                    
                    statusElement.innerHTML = `<span class="status success">Downloading from ${result.regionName}...</span>`;
                    
                    const fileResponse = await fetch(result.downloadUrl);
                    const blob = await fileResponse.blob();
                    const url = window.URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = key.split('/').pop();
                    document.body.appendChild(a);
                    a.click();
                    
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    
                    setTimeout(() => statusElement.innerHTML = '', 3000);
                } catch (error) {
                    console.error('Download failed:', error);
                    statusElement.innerHTML = `<span class="status failed">Error: ${error.message}</span>`;
                    setTimeout(() => statusElement.innerHTML = '', 5000);
                }
            }
            
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
        });
    </script>
</body>
</html>
